{% extends 'shop/management/base.html' %}
{% block management_content %}
<div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
  <div>
    <h2 class="h4 mb-1">Категории</h2>
    <p class="text-muted mb-0">Дерево каталога</p>
  </div>
  <a class="btn btn-primary" href="{% url 'shop:management_category_create' %}">Создать</a>
</div>
<div class="table-responsive admin-table">
  <table class="table align-middle">
    <thead>
      <tr>
        <th>#</th>
        <th>Название</th>
        <th>Слаг</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      {% for category in categories %}
      <tr>
        <td>{{ category.id }}</td>
        <td>{{ category.name }}</td>
        <td>{{ category.slug }}</td>
        <td class="text-end">
          <a class="btn btn-sm btn-outline-primary" href="{% url 'shop:management_category_edit' category.id %}">✏️</a>
          <a class="btn btn-sm btn-outline-danger" href="{% url 'shop:management_category_delete' category.id %}">🗑️</a>
        </td>
      </tr>
      {% empty %}
      <tr><td colspan="4" class="text-center text-muted">Категорий нет</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
