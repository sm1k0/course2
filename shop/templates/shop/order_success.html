{% extends 'shop/base.html' %}
{% block title %}Заказ оформлен · Ашан{% endblock %}

{% block content %}
<div class="hero text-center align-items-center">
  <div class="hero-badge mx-auto">Заказ оформлен</div>
  <h1 class="hero-title">Спасибо за заказ!</h1>
  <p class="hero-subtitle">Номер вашего заказа: <strong>#{{ order.id }}</strong>. Мы уже приступили к обработке.</p>
  <div class="d-flex justify-content-center gap-2 mt-2">
    <a href="{% url 'shop:profile' %}" class="btn btn-primary">Мои заказы</a>
    <a href="{% url 'shop:catalog' %}" class="btn btn-outline-secondary">Вернуться в каталог</a>
  </div>
</div>
{% endblock %}
