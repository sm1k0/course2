{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ашан OMS{% endblock %}</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
        crossorigin="anonymous">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>

<body class="d-flex flex-column min-vh-100"
      data-user-role="{{ request.user.role.code|default_if_none:'' }}"
      data-theme="{{ user_settings.theme|default:'light' }}">

  {# единый header #}
  {% include 'partials/header.html' %}

  {# контент растягивается, футер прижат к низу #}
  <main class="flex-fill pt-5 pb-4">
    <div class="container">
      {% block content %}{% endblock %}
    </div>
  </main>

  {% include 'partials/footer.html' %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
          crossorigin="anonymous"></script>
  <script src="{% static 'js/hotkeys.js' %}"></script>
</body>
</html>
